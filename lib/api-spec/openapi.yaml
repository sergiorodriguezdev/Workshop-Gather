openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workshops
    description: Public workshop discovery
  - name: rsvps
    description: Authenticated customer reservations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workshops:
    get:
      operationId: listWorkshops
      tags: [workshops]
      summary: List upcoming workshops
      responses:
        "200":
          description: Available workshops and current seat counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkshopListPayload"
  /workshops/{workshopId}:
    get:
      operationId: getWorkshop
      tags: [workshops]
      summary: Get workshop details
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Workshop details and current seat count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workshop"
        "404":
          description: Workshop not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/rsvps:
    get:
      operationId: listMyRsvps
      tags: [rsvps]
      summary: List the signed-in customer's RSVPs
      responses:
        "200":
          description: RSVPs belonging to the authenticated Clerk customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyRsvpsPayload"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /me/rsvps/migrate:
    post:
      operationId: migrateMyRsvps
      tags: [rsvps]
      summary: Import the signed-in customer's legacy browser RSVPs
      description: Customer identity is derived from the verified Clerk session. Existing reservations are migrated idempotently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpMigrationInput"
      responses:
        "200":
          description: Profile synchronized and legacy RSVPs processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpMigrationResult"
        "400":
          description: Invalid migration input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workshops/{workshopId}/rsvps:
    post:
      operationId: createWorkshopRsvp
      tags: [rsvps]
      summary: RSVP the signed-in customer to a workshop
      description: Customer identity is derived from the verified Clerk session. Duplicate RSVPs are idempotent.
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "201":
          description: RSVP created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rsvp"
        "200":
          description: Customer already had an RSVP for this workshop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rsvp"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workshop not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Workshop is fully booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWorkshopRsvp
      tags: [rsvps]
      summary: Remove the signed-in customer's workshop RSVP
      description: Removes only the authenticated customer's RSVP. Repeated removals are safe.
      parameters:
        - name: workshopId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: RSVP removed or was already absent
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workshop not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Workshop:
      type: object
      required:
        - id
        - title
        - category
        - date
        - dateLabel
        - dateLong
        - time
        - duration
        - venue
        - address
        - host
        - hostNote
        - capacity
        - seatsReserved
        - available
        - description
        - image
        - color
        - includes
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        date: { type: string, format: date }
        dateLabel: { type: string }
        dateLong: { type: string }
        time: { type: string }
        duration: { type: string }
        venue: { type: string }
        address: { type: string }
        host: { type: string }
        hostNote: { type: string }
        capacity: { type: integer, minimum: 1 }
        seatsReserved: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
        description: { type: string }
        image: { type: string }
        color: { type: string }
        includes:
          type: array
          items: { type: string }
    Rsvp:
      type: object
      required: [id, workshopId, createdAt, alreadyRegistered]
      properties:
        id: { type: integer }
        workshopId: { type: string }
        createdAt: { type: string, format: date-time }
        alreadyRegistered: { type: boolean }
    MyRsvp:
      type: object
      required: [id, createdAt, workshop]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        workshop:
          $ref: "#/components/schemas/Workshop"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
    WorkshopListPayload:
      type: array
      items:
        $ref: "#/components/schemas/Workshop"
    MyRsvpsPayload:
      type: array
      items:
        $ref: "#/components/schemas/MyRsvp"
    RsvpMigrationInput:
      type: object
      required: [legacyWorkshopIds]
      properties:
        legacyWorkshopIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
    RsvpMigrationResult:
      type: object
      required: [migratedWorkshopIds, alreadyPresentWorkshopIds, skippedFullWorkshopIds, unknownWorkshopIds]
      properties:
        migratedWorkshopIds:
          type: array
          items: { type: string }
        alreadyPresentWorkshopIds:
          type: array
          items: { type: string }
        skippedFullWorkshopIds:
          type: array
          items: { type: string }
        unknownWorkshopIds:
          type: array
          items: { type: string }

